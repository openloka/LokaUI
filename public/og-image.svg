<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea58e"/>
      <stop offset="100%" stop-color="#10b99b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#131316"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea58e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0ea58e" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#09090b"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="420" y1="0" x2="420" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="540" y1="0" x2="540" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="660" y1="0" x2="660" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="780" y1="0" x2="780" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="840" y1="0" x2="840" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1020" y1="0" x2="1020" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1080" y1="0" x2="1080" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1140" y1="0" x2="1140" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="480" x2="1200" y2="480" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Ambient glow behind logo area -->
  <ellipse cx="600" cy="260" rx="300" ry="200" fill="url(#glowGrad)"/>

  <!-- Logo icon (matching favicon) -->
  <g transform="translate(540, 160) scale(2.5)">
    <rect width="32" height="32" rx="8" fill="url(#accent)"/>
    <line x1="9" y1="8" x2="9" y2="22" stroke="#022c22" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="9" y1="22" x2="17" y2="22" stroke="#022c22" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="22" cy="17" r="4.5" fill="none" stroke="#022c22" stroke-width="2.5"/>
  </g>

  <!-- LokaUI text -->
  <text x="600" y="310" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="72" font-weight="700" fill="#fafafa" letter-spacing="-2">LokaUI</text>

  <!-- Tagline -->
  <text x="600" y="360" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="400" fill="#a1a1aa">Beautiful, Accessible React Components</text>

  <!-- Decorative UI component previews -->

  <!-- Card 1: Button component preview -->
  <g transform="translate(120, 420)">
    <rect width="200" height="120" rx="12" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="30" font-family="monospace" font-size="11" fill="#71717a">&lt;Button /&gt;</text>
    <rect x="16" y="46" width="100" height="36" rx="8" fill="url(#accent)"/>
    <text x="66" y="69" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#022c22">Click me</text>
    <rect x="126" y="46" width="58" height="36" rx="8" fill="none" stroke="#27272a" stroke-width="1.5"/>
    <text x="155" y="69" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#a1a1aa">Ghost</text>
  </g>

  <!-- Card 2: Input component preview -->
  <g transform="translate(360, 420)">
    <rect width="200" height="120" rx="12" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="30" font-family="monospace" font-size="11" fill="#71717a">&lt;Input /&gt;</text>
    <rect x="16" y="44" width="168" height="38" rx="8" fill="#09090b" stroke="#3f3f46" stroke-width="1"/>
    <text x="28" y="67" font-family="system-ui, sans-serif" font-size="13" fill="#52525b">Enter email...</text>
    <rect x="16" y="92" width="168" height="4" rx="2" fill="#27272a"/>
    <rect x="16" y="92" width="100" height="4" rx="2" fill="url(#accent)" opacity="0.6"/>
  </g>

  <!-- Card 3: Toggle component preview -->
  <g transform="translate(600, 420)">
    <rect width="200" height="120" rx="12" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="30" font-family="monospace" font-size="11" fill="#71717a">&lt;Switch /&gt;</text>
    <!-- Toggle on -->
    <rect x="16" y="50" width="44" height="24" rx="12" fill="url(#accent)"/>
    <circle cx="48" cy="62" r="9" fill="#fff"/>
    <text x="70" y="66" font-family="system-ui, sans-serif" font-size="13" fill="#e4e4e7">Dark mode</text>
    <!-- Toggle off -->
    <rect x="16" y="84" width="44" height="24" rx="12" fill="#3f3f46"/>
    <circle cx="28" cy="96" r="9" fill="#a1a1aa"/>
    <text x="70" y="100" font-family="system-ui, sans-serif" font-size="13" fill="#71717a">Animations</text>
  </g>

  <!-- Card 4: Badge component preview -->
  <g transform="translate(840, 420)">
    <rect width="200" height="120" rx="12" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="30" font-family="monospace" font-size="11" fill="#71717a">&lt;Badge /&gt;</text>
    <rect x="16" y="44" width="60" height="26" rx="13" fill="#0ea58e" fill-opacity="0.15"/>
    <text x="46" y="61" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#0ea58e">Active</text>
    <rect x="86" y="44" width="68" height="26" rx="13" fill="#27272a"/>
    <text x="120" y="61" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#a1a1aa">Pending</text>
    <rect x="16" y="80" width="52" height="26" rx="13" fill="#7c3aed" fill-opacity="0.15"/>
    <text x="42" y="97" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#a78bfa">New</text>
    <rect x="78" y="80" width="76" height="26" rx="13" fill="#dc2626" fill-opacity="0.15"/>
    <text x="116" y="97" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#f87171">Archived</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accent)"/>

  <!-- Top accent line (subtle) -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#accent)" opacity="0.3"/>
</svg>
